name: Release

on:
  release:
    types:
      - published

permissions:
  contents: read
  id-token: write

concurrency:
  group: release-${{ github.event.release.tag_name }}
  cancel-in-progress: false

jobs:
  npm:
    name: npm
    runs-on: ubuntu-latest
    environment: npm
    steps:
      - name: Check out release
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.release.tag_name }}

      - name: Set up Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org
          cache: npm

      - name: Use an OIDC-capable npm CLI
        run: npm install --global npm@11.19.1

      - name: Install dependencies
        run: npm ci

      - name: Run release checks
        run: npm run qa

      - name: Validate release metadata
        run: npm run release:check -- "${{ github.event.release.tag_name }}"

      - name: Check whether this version is already published
        id: registry
        shell: bash
        run: |
          set -euo pipefail
          package_name="$(node -p "JSON.parse(require('fs').readFileSync('package.json', 'utf8')).name")"
          package_version="$(node -p "JSON.parse(require('fs').readFileSync('package.json', 'utf8')).version")"
          if npm view "${package_name}@${package_version}" version --json >/dev/null 2>&1; then
            published_repository="$(npm view "${package_name}@${package_version}" repository.url)"
            if [ "$published_repository" != "git+https://github.com/Jason-Doyle/ContentContractEngine.git" ]; then
              echo "Published package repository does not match this repository."
              exit 1
            fi
            published_git_head="$(npm view "${package_name}@${package_version}" gitHead)"
            if [ "$published_git_head" != "${GITHUB_SHA}" ]; then
              echo "Published package gitHead does not match the release tag."
              exit 1
            fi
            echo "published=true" >> "$GITHUB_OUTPUT"
          else
            echo "published=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Publish stable package
        if:
          steps.registry.outputs.published != 'true' &&
          github.event.release.prerelease == false
        run: npm publish --ignore-scripts

      - name: Publish prerelease package
        if:
          steps.registry.outputs.published != 'true' &&
          github.event.release.prerelease
        run: npm publish --ignore-scripts --tag next
